indices:
  default:
    include:
      - /issues/**
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      project:
        select: head > meta[name="project"]
        value: attribute(el, "content")
      issue-number:
        select: head > meta[name="issue-number"]
        value: attribute(el, "content")
      issue-url:
        select: head > meta[name="issue-url"]
        value: attribute(el, "content")
      pr-url:
        select: head > meta[name="pr-url"]
        value: attribute(el, "content")
      flows-url:
        select: head > meta[name="flows-url"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
